name: Compilar APK
on:
  push:
    branches: [main, 'ccr-**']
    paths: ['public/**', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DragonMystery.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DragonMystery-apk
          path: DragonMystery.apk
      - name: Publicar APK de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-prueba --yes --cleanup-tag || true
          gh release create apk-prueba DragonMystery.apk --prerelease --target "$GITHUB_SHA" \
            --title "APK de prueba" --notes "Compilación automática para probar en Android."
