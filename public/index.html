<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Dragon Mystery</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:monospace;overflow:hidden;touch-action:none}
/* El juego siempre se muestra en horizontal y a pantalla completa. */
#wrap{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000}
body.rot #wrap{width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
#cv{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
#pad{display:none;position:absolute;inset:0;pointer-events:none}
body.touch #pad{display:block}
#dpad,#btns{position:absolute;bottom:5vmin;pointer-events:auto;opacity:.6}
#dpad{left:max(4vmin,env(safe-area-inset-left));width:46vmin;height:46vmin;border-radius:50%;background:#1b2233;border:.8vmin solid #5a6c9a;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;font-size:7vmin;color:#c8d6ff}
#dpad span{pointer-events:none}
#btns{right:max(4vmin,env(safe-area-inset-right));display:grid;grid-template-columns:1fr 1fr;gap:3vmin}
.bt{width:21vmin;height:21vmin;border-radius:50%;border:.8vmin solid #5a6c9a;background:#1b2233;color:#fff;font:bold 5vmin monospace;display:flex;align-items:center;justify-content:center}
.bt.on,#dpad.on{background:#3a4c74;opacity:1}
#dpad.img,.bt.img{background:none center/100% 100% no-repeat;border:0;border-radius:0;color:transparent;font-size:0;image-rendering:pixelated}
#bA{background:#1f6a58;border-color:#3fbf9f}#bT{background:#6a441f;border-color:#d08a3a}
#nameov{position:absolute;inset:0;background:rgba(5,8,14,.92);display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8vmin;gap:4vmin;z-index:5}
#nameov input{font:bold 6vmin monospace;padding:2vmin;width:60vmin;text-align:center;border-radius:2vmin;border:2px solid #3fbf9f;background:#101826;color:#fff;user-select:text;-webkit-user-select:text}
#nameov button{font:bold 6vmin monospace;padding:2vmin 7vmin;border-radius:2vmin;border:0;background:#2f8f78;color:#fff}
#nameov div{font:bold 5vmin monospace}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="720" height="480"></canvas>
  <div id="pad">
    <div id="dpad"><span>↖</span><span>↑</span><span>↗</span><span>←</span><span>●</span><span>→</span><span>↙</span><span>↓</span><span>↘</span></div>
    <div id="btns">
      <div class="bt" id="bT" data-k="t">TÉC</div><div class="bt" id="bA" data-k="a">A</div>
      <div class="bt" id="bB" data-k="b">MENÚ</div><div class="bt" id="bW" data-k="w">ESP</div>
    </div>
  </div>
  <div id="nameov">
    <div>¿Cómo se llama tu héroe?</div>
    <input id="nameinp" maxlength="10" value="Kai" autocomplete="off">
    <button id="namebtn">Empezar</button>
  </div>
</div>
<script src="game.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'&&location.hostname!=='appassets.androidplatform.net')navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
