plugins { id 'com.android.application' }

android {
    namespace 'com.dragonmystery.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.dragonmystery.game'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    // El juego web de public/ se empaqueta tal cual como recursos de la app.
    sourceSets { main { assets.srcDirs = ['../../public'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
